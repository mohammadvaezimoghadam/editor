services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: wagtail_ai_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STATIC_ROOT=/app/test-static
      - DATABASE_URL=sqlite:////app/data/wagtail_ai.db
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - static_volume:/app/test-static
      - media_volume:/app/test-media
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: wagtail_ai_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - web
    networks:
      - app_network

volumes:
  static_volume:
  media_volume:

networks:
  app_network:
    driver: bridge
